name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release packages
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      # The shared workflow defaults to the 10.0.x SDK, which cannot build the net11.0 target this
      # repository gained. Keep in sync with `sdk.version` in global.json (and with pr.yml).
      dotnet-version: "11.0.100-rc.1.26425.128"
      release-mode: NuGet
      release-branch: main
    secrets: inherit